name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  SUPABASE_EXCLUDE: realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, tipos y tests unitarios
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run test:coverage # exige el 90 % (vitest.config.mts)

  db:
    name: Tests de base de datos (RLS, capacidad)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Solo db, auth, API y storage: el resto de servicios no se usa en las pruebas.
      - run: npx supabase start -x $SUPABASE_EXCLUDE
      - name: Exportar credenciales locales de Supabase
        run: |
          eval "$(npx supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "SUPABASE_SECRET_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}"
            echo "SUPABASE_DB_URL=$DB_URL"
          } >> "$GITHUB_ENV"
      - run: npm run test:db

  e2e:
    name: E2E (Pixel 7 + Desktop)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Solo db, auth, API y storage: el resto de servicios no se usa en las pruebas.
      - run: npx supabase start -x $SUPABASE_EXCLUDE
      - name: Exportar credenciales locales de Supabase
        run: |
          eval "$(npx supabase status -o env)"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "SUPABASE_SECRET_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}"
            echo "SUPABASE_DB_URL=$DB_URL"
          } >> "$GITHUB_ENV"
      - name: Caché de Chromium (Playwright)
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Caché del build de Next.js
        uses: actions/cache@v6
        with:
          path: .next-e2e/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      # Si apt se cuelga, que falle rápido en vez de esperar horas.
      - run: npx playwright install --with-deps chromium
        timeout-minutes: 4
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
